syntax = "proto3";

option java_package = "com.kuaishou.mmu.rpc.chat";
option java_outer_classname = "KuaiYiChatServiceProto";
option java_multiple_files = true;

package mmu.chat;

service KuaiYiChatService {
    rpc Models(KuaiYiChatModelsRequest) returns (KuaiYiChatModelsResponse); //list models
    rpc Chat(KuaiYiChatCompletionRequest) returns (KuaiYiChatCompletionResponse);
    rpc StreamChat(KuaiYiChatCompletionRequest) returns (stream KuaiYiChatCompletionResponse);
}

message KuaiYiChatModelsRequest {
    string key = 1; //业务标识,新业务接入需要申请
}

message ModelInfo {
    string model = 1;
}

message KuaiYiChatModelsResponse {
    repeated ModelInfo models = 1;
    string id = 2; // request id
}

message MessageInfo {
    string role = 1;
    string content = 2;
}

// 暂未启用
message ResponseFormat {
    ResponseType type = 1;
}

// tools 相关
message FunctionInfo {
    string description = 1;
    string name = 2;
    string parameters = 3;
}

message ToolInfo {
    string type = 1;
    FunctionInfo function = 2;
}

message ToolChoiceFunction {
    string name = 1;
}

message ToolChoiceObj {
    string type = 1;
    ToolChoiceFunction function = 2;
}

// request
message KuaiYiChatCompletionRequest {
    string key = 1; //业务标识,新业务接入需要申请
    string model = 2;
    repeated MessageInfo messages = 3;
    int32 max_tokens = 4;
    int32 n = 5;
    bool stream = 6;
    float repetition_penalty = 8;
    float temperature = 9;
    float top_p = 10;
    int32 random_seed = 11;
    repeated string stop = 12;
    bool logprobs = 13;
    int32 top_logprobs = 14;
    ResponseFormat response_format = 16;
    repeated ToolInfo tools = 17;
    oneof tool_choice {
        string tool_choice_str = 18;
        ToolChoiceObj tool_choice_obj = 19;
    }
    bool parallel_tool_calls = 20;

}

message Content {
    string token = 1;
    float logprob = 2;
}

message LogProbs {
    repeated Content content = 1;
}

message ToolFunction {
    string name = 1;
    string arguments = 2;
}

message ToolCall {
    string id = 1;
    string type = 2;
    ToolFunction function = 3;
}

message Message {
    string role = 1;
    string content = 2;
    repeated ToolCall tool_calls = 3;
}

message Choice {
    int32 index = 1;
    string finish_reason = 2;
    map<string, string> message = 3;
    repeated LogProbs logprobs = 4;
    Message message_v2 = 5; // 与message内容一致，增加toos_calls【暂未上线】
}

message Usage {
    int32 prompt_tokens = 1;
    int32 completion_tokens = 2;
    int32 total_tokens = 3;
}

enum ResultCode {
    SUCCESS = 0;
    INPUT_SIZE_ERROR = 1;
    INPUT_PARAM_ERROR = 10;
    INTERNAL_ERROR = 11;
    OVER_RATE_LIMIT = 13; // 超过限流配置
    REJECT = 14; // 拒绝
    UNKOWN = 15;
}

message ResultStatus {
    ResultCode code = 1;
    string msg = 2; //具体的错误信息
}

// 暂未启用
enum ResponseType {
    TEXT = 0;
    JSON_OBJECT = 1;
}

message KuaiYiChatCompletionResponse {
    string key = 1; //业务标识,新业务接入需要申请
    string object = 2;
    string id = 3; //请求Id
    string model = 4;
    int64 created = 5;
    ResultStatus status = 6; //状态,成功为SUCCESS

    repeated Choice choices = 7;
    Usage usage = 8;
}